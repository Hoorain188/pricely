# Render Blueprint — unified Pricely API.
#
# The database is not defined here: it already lives on Neon.
#
# Every value marked `sync: false` is a secret. Render prompts for it when
# the blueprint is created and stores it on the service — it is never
# committed here. Copy the values out of user-secrets with:
#
#   cd backend/Pricely.Api && dotnet user-secrets list

services:
  # ── Unified API: auth, admin, scrapers, browse/search ───────────────────
  - type: web
    name: pricely-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # ASP.NET maps __ to the config hierarchy, so ConnectionStrings__Default
      # is the same key as ConnectionStrings:Default in user-secrets.
      - key: ConnectionStrings__Default
        sync: false
      # Scrapers also look for this key (legacy from PriceCompare.Api)
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SigningKey
        sync: false
      # Program.cs refuses to start outside Development without these —
      # password resets and team invites are emailed.
      - key: Email__FromAddress
        sync: false
      - key: Email__SmtpPassword
        sync: false

